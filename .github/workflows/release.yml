name: Release

# Push a tag matching the gemspec version (e.g. v0.7.2) to publish to RubyGems.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # ceiling for the called workflow: its coverage-badge job declares contents: write
    # (skipped on tags); lint/test still run with ci.yml's top-level contents: read
    permissions:
      contents: write

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/dynamic-active-model
    permissions:
      contents: write # create the GitHub release
      id-token: write # RubyGems trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      - name: Verify tag matches gemspec version
        run: |
          version=$(ruby -e 'puts Gem::Specification.load("dynamic-active-model.gemspec").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match gemspec version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: gem build dynamic-active-model.gemspec

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - run: gem push "dynamic-active-model-$VERSION.gem"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dynamic-active-model-$VERSION.gem" --title "$GITHUB_REF_NAME" --generate-notes

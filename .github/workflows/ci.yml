name: CI

on:
  push:
    branches: [master]
  # release-please PRs change only these files. Their runs are triggered by
  # github-actions[bot], which GitHub holds for approval until they expire as
  # failures; release.yml runs this workflow before publishing anyway. A PR is
  # skipped only if every file it changes is listed here.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - Gemfile.lock
      - lib/dynamic-active-model/version.rb
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rubocop --format github

  # Supported range: Ruby 3.2-4.0 x ActiveRecord/Rails 7.1-8.1. The root Gemfile.lock is a
  # Ruby 4.0 development lockfile (its tooling needs Ruby 3.3+), so only Ruby 4.0 + 8.1 uses it;
  # every other combination resolves gemfiles/activerecord_X.gemfile fresh.
  test:
    name: Tests (Ruby ${{ matrix.ruby }}, ActiveRecord ${{ matrix.activerecord }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        activerecord: ['7.1', '7.2', '8.0', '8.1']
    env:
      BUNDLE_GEMFILE: >-
        ${{ matrix.ruby == '4.0' && matrix.activerecord == '8.1' && format('{0}/Gemfile', github.workspace)
        || format('{0}/gemfiles/activerecord_{1}.gemfile', github.workspace, matrix.activerecord) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      # one job's report feeds the coverage badge
      - name: Upload coverage report
        if: matrix.ruby == '4.0' && matrix.activerecord == '8.1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          # .last_run.json (read by the badge job) is a dotfile; upload-artifact skips those by default
          include-hidden-files: true
          retention-days: 14

  # The core suite against real PostgreSQL and MySQL servers: index and foreign key
  # introspection differs per adapter. MySQL goes through trilogy (no client library).
  test-databases:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL 17
            image: postgres:17
            adapter: postgresql
            port: 5432
            username: postgres
            health-cmd: pg_isready -U postgres
          - database: MySQL 8.4
            image: mysql:8.4
            adapter: trilogy
            port: 3306
            username: root
            health-cmd: mysqladmin ping -h 127.0.0.1 -uroot -pci-password
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      BUNDLE_WITH: databases
      DATABASE_ADAPTER: ${{ matrix.adapter }}
      DATABASE_PORT: ${{ matrix.port }}
      DATABASE_USERNAME: ${{ matrix.username }}
      DATABASE_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rspec

  test-rails:
    name: Rails gem tests (Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        rails: ['7.1', '7.2', '8.0', '8.1']
    env:
      BUNDLE_GEMFILE: >-
        ${{ matrix.rails == '8.1' && format('{0}/dynamic-active-model-rails/Gemfile', github.workspace)
        || format('{0}/dynamic-active-model-rails/gemfiles/rails_{1}.gemfile', github.workspace, matrix.rails) }}
    defaults:
      run:
        working-directory: dynamic-active-model-rails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: dynamic-active-model-rails
      - run: bundle exec rspec

  # Publishes coverage.svg to the orphan `badges` branch; the README badge points at it.
  # Skipped when called from release.yml (github.workflow is the caller's name there).
  coverage-badge:
    if: github.workflow == 'CI' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage/
      - run: ruby script/coverage_badge.rb coverage/.last_run.json "$RUNNER_TEMP/coverage.svg"
      - name: Push badge to badges branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin badges; then
            git switch badges
          else
            git switch --orphan badges
          fi
          cp "$RUNNER_TEMP/coverage.svg" coverage.svg
          git add coverage.svg
          git diff --cached --quiet || git commit -m "coverage badge for ${GITHUB_SHA::7}"
          git push origin badges
